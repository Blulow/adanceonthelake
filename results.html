<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lyricapp</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <div id="results">
        <div id="head" class="section">
            <div id="showpass">SHOW CLEARED</div>
            <div id="rank" class="labelled-item">
                <span class="label">RANK</span>
                <span id="item-rank" class="item">S</span>
                <div id="rankbar">
                    <div id="rankbar-progress"></div>
                    <div id="rankbar-frame"></div>
                    <div id="rankbar-marks">
                        <div class="rankbar-mark" data-rankbar="NOHIT">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">NO HIT</span>
                        </div>
                        <div class="rankbar-mark" data-rankbar="SS">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">SS</span>
                        </div>
                        <div class="rankbar-mark" data-rankbar="S">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">S</span>
                        </div>
                        <div class="rankbar-mark" data-rankbar="A">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">A</span>
                        </div>
                        <div class="rankbar-mark" data-rankbar="B">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">B</span>
                        </div>
                        <div class="rankbar-mark" data-rankbar="C">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">C</span>
                        </div>
                        <div class="rankbar-mark" data-rankbar="D">
                            <div class="rankbar-dash"></div>
                            <span class="rankbar-label">D</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="divider"></div>
        <div id="details" class="section">
            <div id="hits" class="labelled-item">
                <span class="label">HITS</span>
                <span id="item-hits" class="item">99</span>
            </div>
            <div id="coins" class="labelled-item">
                <span class="label">COINS</span>
                <span id="item-coins" class="item">99</span>
            </div>
            <div id="score-container">
                <div id="score" class="labelled-item">
                    <span class="label">SCORE</span>
                    <span id="item-score" class="item">999999</span>
                </div>
                <div id="combobonus" class="labelled-item">
                    <span class="label">COMBO<br />BONUS</span>
                    <span class="item">+</span>
                    <span id="item-combobonus" class="item">999999</span>
                </div>
                <div id="hitpenalty" class="labelled-item">
                    <span class="label">HIT<br />PENALTY</span>
                    <span class="item">-</span>
                    <span id="item-hitpenalty" class="item">999999</span>
                </div>
            </div>
            <div id="maxcombo" class="labelled-item">
                <span class="label">MAX COMBO</span>
                <span id="item-maxcombo" class="item">99</span>
            </div>
        </div>
        <div id="retrymsg-container">
            <span>PRESS ANY KEY TO CONTINUE</span>
        </div>
    </div>
    <script type="module" src="src/results.js"></script>
</body>

</html>
